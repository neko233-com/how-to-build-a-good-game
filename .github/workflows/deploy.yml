name: Deploy to GitHub Pages

# 只有打 tag 才发布线上站点（普通 push 只跑 ci.yml，不会动线上）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Vite+
        # 官方明确要求锁定精确版本，不要使用 v1 这类浮动标签
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: 输出工具链版本
        run: vp toolchain

      - name: 安装依赖（锁文件不一致即失败）
        run: vp install --frozen-lockfile

      - name: 格式 / Lint / 类型检查
        run: vp check

      - name: 单元测试
        run: vp test

      - name: 生产构建
        run: vp build

      - name: 配置 Pages
        uses: actions/configure-pages@v6.0.0

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
