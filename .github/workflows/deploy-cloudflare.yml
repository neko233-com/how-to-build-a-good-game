name: Deploy to Cloudflare Pages

# 只在打 tag 时发布（与 GitHub Pages 的发布节奏一致）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Cloudflare 部署在根域名（note.neko233.com），所以 base 是 /
      SITE_BASE: /
      # 项目名可在仓库 Settings → Variables 里用 CF_PAGES_PROJECT 覆盖
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'neko233-note' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: 安装依赖（锁文件不一致即失败）
        run: vp install --frozen-lockfile

      - name: 格式 / Lint / 类型检查
        run: vp check

      - name: 单元测试
        run: vp test

      - name: 生产构建（base = /）
        run: vp build

      - name: 确认产物不含敏感信息
        # 兜底检查：构建产物里不应出现任何凭据形态的字符串
        run: |
          if grep -rIl -E 'CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|Bearer [A-Za-z0-9._-]{20,}' dist; then
            echo "::error::构建产物中疑似包含凭据，已中止发布"
            exit 1
          fi
          echo "产物检查通过"

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }}
